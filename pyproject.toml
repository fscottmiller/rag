[project]
name = "utralight-rag-mcp"
version = "0.1.0"
description = "Utralight RAG service with REST and MCP interfaces"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "chonkie>=1.0.0",
  "fastapi>=0.115.0",
  "mcp>=1.9.0",
  "python-multipart>=0.0.9",
  "sqlite-vec>=0.1.6",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
local-embeddings = ["sentence-transformers>=3.4.0"]


[dependency-groups]
dev = [
  "coverage>=7.15.2",
  "httpx>=0.27.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/utralight_rag"]


[tool.coverage.run]
branch = true
source = ["utralight_rag"]

[tool.coverage.report]
show_missing = true
fail_under = 95

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
