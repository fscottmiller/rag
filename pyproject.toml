[project]
name = "transient-rag-mcp"
version = "0.1.0"
description = "A lightweight transient RAG service with REST and MCP interfaces"
readme = "ARCHITECTURE.md"
requires-python = ">=3.11"
dependencies = [
  "chonkie>=1.0.0",
  "fastapi>=0.115.0",
  "mcp>=1.9.0",
  "python-multipart>=0.0.9",
  "sqlite-vec>=0.1.6",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
local-embeddings = ["sentence-transformers>=3.4.0"]


[dependency-groups]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
