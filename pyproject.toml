[project]
name = "ultralight-rag-mcp"
version = "0.1.0"
description = "Ultralight RAG service with REST and MCP interfaces"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "chonkie>=1.0.0",
  "fastapi>=0.115.0",
  "fastembed>=0.7.4",
  "onnxruntime<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "mcp>=1.27,<2",
  "python-multipart>=0.0.9",
  "sqlite-vec>=0.1.6",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
local-embeddings = ["sentence-transformers>=3.4.0"]


[dependency-groups]
dev = [
  "coverage>=7.15.2",
  "httpx>=0.27.0",
  "httpx2>=2.9.1",
  "mypy>=2.3.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-randomly>=3.15.0",
]

[tool.uv]
# cryptography is a transitive dependency (via pyjwt[crypto], pulled in by mcp[crypto]).
# We don't import it directly, so it's not listed under [project.dependencies] -
# but pin a floor here so a future `uv lock` can't silently resolve back to a
# version vulnerable to PYSEC-2026-3552 (fixed in 50.0.0) if an intermediate
# dependency ever relaxes its own constraint.
constraint-dependencies = ["cryptography>=50.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ultralight_rag"]


[tool.coverage.run]
branch = true
source = ["ultralight_rag"]

[tool.coverage.report]
show_missing = true
fail_under = 95
precision = 2

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "error",
  # Third-party: the `mcp` SDK's StreamableHTTP session manager keeps an
  # anyio MemoryObjectReceiveStream per session, and one is closed by GC
  # rather than explicitly. Root cause is NOT fully isolated: it is tied to
  # session *creation*, not teardown -- the leak persists even when the test
  # sends an explicit session-terminating `DELETE /mcp` (200 OK), and occurs
  # after a bare `initialize` with no further calls, while a test that opens
  # no MCP session at all does not leak. Confirmed third-party in origin: the
  # traceback frames are entirely inside the `mcp` package, not this repo.
  # Ignored narrowly by exact origin, same rationale as above.
  "ignore:Exception ignored in. <function MemoryObjectReceiveStream\\.__del__.*:pytest.PytestUnraisableExceptionWarning",
]

[tool.mutmut]
# Scoped to the highest-risk modules identified by the security review (auth,
# storage, and the embedding pipeline that handles credentials in URLs) --
# full-repo mutation testing is too slow to run routinely; see the CI
# hardening PR body for measured per-module timings. Runs on a schedule /
# manual trigger only (.github/workflows/mutation.yml), never on push/PR.
source_paths = ["src"]
only_mutate = [
  "src/ultralight_rag/auth.py",
  "src/ultralight_rag/storage/sqlite.py",
  "src/ultralight_rag/pipeline/embeddings.py",
]
# Restricting to the tests that actually exercise these modules keeps each
# mutant's test run fast, and (found empirically) avoids a mutmut quirk: it
# calls pytest.main() multiple times in one long-lived process, so a test
# like test_mcp.py::test_combined_import_does_not_create_an_unused_rest_app
# that asserts on fresh-process module state spuriously fails there even
# though it passes reliably (verified with 8+ full-suite runs, including
# randomized order) under normal single-invocation pytest/CI.
# test_service.py is included because it holds the only coverage of
# pipeline/embeddings.py's credential guard (_has_query_credentials). Omitting
# it made that guard's mutants look like survivors when they are in fact
# killed, i.e. the report claimed a credential-handling coverage gap that did
# not exist. A mutation report that cries wolf stops being read, so any test
# file that exercises an only_mutate module belongs in this list.
pytest_add_cli_args_test_selection = [
  "tests/test_auth.py",
  "tests/test_mcp_auth.py",
  "tests/test_storage.py",
  "tests/test_storage_concurrency.py",
  "tests/test_embeddings.py",
  "tests/test_service.py",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "ASYNC", "UP"]

[tool.ruff.lint.per-file-ignores]
# Pytest's `assert` statements trip S101 (assert-detection is meant for
# production code shipped without -O, not test suites where assert *is* the
# mechanism); this leaves all other S-rules active for tests/.
"tests/**" = ["S101"]

[tool.mypy]
# Scoped narrowly to mcp_server/: locks in the honest CallToolResult return
# types this module relies on (see server.py's SearchResult/DocumentResult/
# DeleteResult aliases). Not repo-wide -- pipeline/ and storage/ have
# pre-existing, unrelated errors (an untyped sqlite_vec import, int(Any |
# None) in chunking.py, a non-iterable `object` in embeddings.py, and a
# missing sentence-transformers stub) that are out of scope for this PR and
# would need their own dedicated cleanup to gate on.
python_version = "3.12"
files = ["src/ultralight_rag/mcp_server"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
