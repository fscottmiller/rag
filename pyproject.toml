[project]
name = "utralight-rag-mcp"
version = "0.1.0"
description = "Utralight RAG service with REST and MCP interfaces"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "chonkie>=1.0.0",
  "fastapi>=0.115.0",
  "fastembed>=0.7.4",
  "onnxruntime<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "mcp>=1.27,<2",
  "python-multipart>=0.0.9",
  "sqlite-vec>=0.1.6",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
local-embeddings = ["sentence-transformers>=3.4.0"]


[dependency-groups]
dev = [
  "coverage>=7.15.2",
  "httpx>=0.27.0",
  "httpx2>=2.9.1",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-randomly>=3.15.0",
]

[tool.uv]
# cryptography is a transitive dependency (via pyjwt[crypto], pulled in by mcp[crypto]).
# We don't import it directly, so it's not listed under [project.dependencies] -
# but pin a floor here so a future `uv lock` can't silently resolve back to a
# version vulnerable to PYSEC-2026-3552 (fixed in 50.0.0) if an intermediate
# dependency ever relaxes its own constraint.
constraint-dependencies = ["cryptography>=50.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/utralight_rag"]


[tool.coverage.run]
branch = true
source = ["utralight_rag"]

[tool.coverage.report]
show_missing = true
fail_under = 95
precision = 2

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "error",
  # Pre-existing resource leak (not fixed by this PR -- see PR body for details,
  # out of scope: fix belongs in src/): `_read_document_request` in api/main.py
  # awaits `request.form()` for multipart uploads but never calls
  # `await form.close()`, so the backing SpooledTemporaryFile for uploaded
  # files is only closed when garbage collected. GC then raises a
  # ResourceWarning from inside `__del__`, which pytest reports as an
  # "unraisable exception" warning. Ignored narrowly by exact origin so any
  # *other* unraisable-exception warning still fails the build.
  "ignore:Exception ignored in. <function SpooledTemporaryFile\\.__del__.*:pytest.PytestUnraisableExceptionWarning",
  # Third-party: the `mcp` SDK's StreamableHTTP session manager keeps an
  # anyio MemoryObjectReceiveStream per session. Sessions opened in tests via
  # starlette's TestClient (rather than a real client that sends a session
  # -terminating DELETE) aren't always torn down before the TestClient's
  # lifespan shuts down, so the stream is closed by GC instead of explicitly
  # inside the SDK. Ignored narrowly by exact origin, same rationale as above.
  "ignore:Exception ignored in. <function MemoryObjectReceiveStream\\.__del__.*:pytest.PytestUnraisableExceptionWarning",
  # Pre-existing resource leak (not fixed by this PR, tracked as follow-up
  # work): tests across test_mcp.py, test_service.py, and test_mcp_auth.py
  # construct `SQLiteStore` directly and never call `.close()`, so the
  # underlying `sqlite3.Connection` is only released at garbage collection.
  # GC then raises `ResourceWarning: unclosed database`, which pytest reports
  # as an "unraisable exception" warning -- surfaced by this zero-warning
  # enforcement itself, on Python 3.13's GC timing where 3.11/3.12 did not
  # trigger it. The real fix is to give `SQLiteStore` context-manager support
  # and/or close stores via a fixture in the test suite; that's out of scope
  # here (belongs in src/ and tests/). Ignored narrowly by exact origin so
  # any *other* unraisable-exception warning still fails the build. Remove
  # this ignore once the leak is fixed.
  "ignore:Exception ignored in. <sqlite3\\.Connection object at 0x.*:pytest.PytestUnraisableExceptionWarning",
]

[tool.mutmut]
# Scoped to the highest-risk modules identified by the security review (auth,
# storage, and the embedding pipeline that handles credentials in URLs) --
# full-repo mutation testing is too slow to run routinely; see the CI
# hardening PR body for measured per-module timings. Runs on a schedule /
# manual trigger only (.github/workflows/mutation.yml), never on push/PR.
source_paths = ["src"]
only_mutate = [
  "src/utralight_rag/auth.py",
  "src/utralight_rag/storage/sqlite.py",
  "src/utralight_rag/pipeline/embeddings.py",
]
# Restricting to the tests that actually exercise these modules keeps each
# mutant's test run fast, and (found empirically) avoids a mutmut quirk: it
# calls pytest.main() multiple times in one long-lived process, so a test
# like test_mcp.py::test_combined_import_does_not_create_an_unused_rest_app
# that asserts on fresh-process module state spuriously fails there even
# though it passes reliably (verified with 8+ full-suite runs, including
# randomized order) under normal single-invocation pytest/CI.
pytest_add_cli_args_test_selection = [
  "tests/test_auth.py",
  "tests/test_mcp_auth.py",
  "tests/test_storage.py",
  "tests/test_storage_concurrency.py",
  "tests/test_embeddings.py",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "ASYNC", "UP"]

[tool.ruff.lint.per-file-ignores]
# Pytest's `assert` statements trip S101 (assert-detection is meant for
# production code shipped without -O, not test suites where assert *is* the
# mechanism); this leaves all other S-rules active for tests/.
"tests/**" = ["S101"]
